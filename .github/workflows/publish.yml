# Publish to npm on a GitHub Release — no tokens, no 2FA prompt.
#
# Auth is npm Trusted Publishing (OIDC): npm verifies this workflow's identity
# against the trusted publisher configured on the package page, so nothing is
# stored as a repository secret and nobody has to authenticate per release.
#
# ONE-TIME SETUP (browser, once ever):
#   npmjs.com → package `hop2` → Settings → Trusted Publisher → GitHub Actions
#   Organization/user: jzthree   Repository: hop   Workflow: publish.yml
#
# TO RELEASE (this is the whole flow):
#   gh release create v0.12.0 --generate-notes
# The tag decides the published version, and the bump is committed back to
# main — so the version on npm always identifies exactly one tree, which is
# what went wrong before (0.11.0 sat on npm for 264 commits while the working
# tree stayed 0.11.0, making stale installs invisible).
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.12.0)"
        required: true

permissions:
  contents: write # commit the version bump back to the default branch
  id-token: write # OIDC token for trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; the runner's bundled npm is older.
      - run: npm install -g npm@latest

      - name: Set version from the release tag
        run: |
          RAW="${{ github.event.release.tag_name || inputs.version }}"
          VERSION="${RAW#v}"
          echo "Publishing $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci || npm install

      - name: Test
        run: npm test

      - name: Publish
        run: npm publish --provenance --access public

      - name: Commit the version bump
        run: |
          if git diff --quiet package.json; then
            echo "Version unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): ${{ github.event.release.tag_name || inputs.version }} [skip ci]"
          git pull --rebase --autostash origin ${{ github.event.repository.default_branch }}
          git push origin HEAD:${{ github.event.repository.default_branch }}
