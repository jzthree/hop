<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" role="img" aria-label="hop on the phone: the native iOS app showing the session wall with a morning briefing and live terminal tiles, and HopBoard, a system-wide keyboard with on-device Whisper dictation — audio never leaves the phone.">
  <defs>
    <linearGradient id="canvasM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16171c"/>
      <stop offset="1" stop-color="#101116"/>
    </linearGradient>
    <filter id="shadowM" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="phoneA"><rect x="120" y="96" width="250" height="470" rx="28"/></clipPath>
    <clipPath id="phoneB"><rect x="612" y="96" width="250" height="470" rx="28"/></clipPath>
  </defs>

  <!-- canvas -->
  <rect x="0.5" y="0.5" width="979" height="619" rx="18" fill="url(#canvasM)" stroke="#272831"/>

  <!-- kicker -->
  <text x="490" y="44" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="0.14em" fill="#8d909b">THE FLEET IN YOUR POCKET — NATIVE APP, AND A KEYBOARD THAT LISTENS ON-DEVICE</text>

  <!-- ═══════════ ① hop-ios: the wall, native ═══════════ -->
  <g filter="url(#shadowM)">
    <rect x="120" y="96" width="250" height="470" rx="28" fill="#0b0b0e" stroke="#33343c" stroke-width="2"/>
  </g>
  <g clip-path="url(#phoneA)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <!-- dynamic island -->
    <rect x="205" y="106" width="80" height="16" rx="8" fill="#000000"/>
    <!-- app header -->
    <text x="136" y="146" fill="#e6e6eb" font-weight="700" font-size="13">Sessions</text>
    <text x="354" y="146" text-anchor="end" fill="#8d909b" font-size="10">4 live</text>
    <!-- briefing card -->
    <rect x="132" y="158" width="226" height="86" rx="10" fill="#17181f" stroke="#2c2d36"/>
    <text x="142" y="176" font-size="9.5"><tspan fill="#a78bfa" font-weight="700">✦ Briefing</tspan><tspan fill="#8d909b">&#160;&#160;7:30am</tspan></text>
    <text x="142" y="192" fill="#c9cad3" font-size="9">Nebula landed the ingest refactor</text>
    <text x="142" y="205" fill="#c9cad3" font-size="9">overnight — 41s → 9s. Polaris is</text>
    <text x="142" y="218" fill="#c9cad3" font-size="9">mid-benchmark, no regressions.</text>
    <text x="142" y="235" font-size="9"><tspan fill="#f0883e">●</tspan><tspan fill="#e6e6eb">&#160;Aurora wants a review</tspan></text>
    <!-- tile: Nebula -->
    <rect x="132" y="254" width="226" height="92" rx="10" fill="#101116" stroke="#2c2d36"/>
    <text x="142" y="270" font-size="9.5"><tspan fill="#28c840">●</tspan><tspan fill="#e6e6eb" font-weight="700">&#160;Nebula</tspan></text>
    <text x="142" y="288" fill="#8d909b" font-size="8.5">✓ tests: 47 passed</text>
    <text x="142" y="301" fill="#8d909b" font-size="8.5">transform src/hooks/usePresence.ts</text>
    <text x="142" y="314" fill="#8d909b" font-size="8.5">128 modules in 296ms</text>
    <text x="142" y="334" font-size="8.5"><tspan fill="#6e7079">❯</tspan><tspan fill="#c9cad3">&#160;</tspan></text>
    <rect x="152" y="326" width="5" height="10" fill="#a78bfa" opacity="0.85"/>
    <!-- tile: Polaris with bell -->
    <rect x="132" y="356" width="226" height="70" rx="10" fill="#101116" stroke="#7c3aed"/>
    <text x="142" y="372" font-size="9.5"><tspan fill="#a78bfa">◉</tspan><tspan fill="#e6e6eb" font-weight="700">&#160;Polaris</tspan><tspan fill="#f0883e">&#160;· needs you</tspan></text>
    <text x="142" y="390" fill="#8d909b" font-size="8.5">rollout wave 3/4 complete</text>
    <text x="142" y="403" fill="#8d909b" font-size="8.5">continue to wave 4/4? (y/n)</text>
    <!-- keyboard hint strip -->
    <rect x="132" y="436" width="226" height="30" rx="8" fill="#17181f" stroke="#2c2d36"/>
    <text x="245" y="455" text-anchor="middle" fill="#8d909b" font-size="9">esc · tab · ctrl · ↑ ↓ · ⌘K</text>
    <!-- home indicator -->
    <rect x="205" y="546" width="80" height="4" rx="2" fill="#33343c"/>
  </g>
  <text x="245" y="592" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#c9cad3"><tspan fill="#a78bfa" font-weight="700">①</tspan> native app — the wall, the briefing, push when a session rings</text>

  <!-- connective arrow -->
  <g stroke="#3d3e49" stroke-width="1.5" fill="none">
    <path d="M 386 330 C 450 330 530 330 596 330" stroke-dasharray="4 5"/>
  </g>
  <text x="491" y="318" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8d909b">same fleet · same daemon</text>

  <!-- ═══════════ ② HopBoard: dictation keyboard ═══════════ -->
  <g filter="url(#shadowM)">
    <rect x="612" y="96" width="250" height="470" rx="28" fill="#0b0b0e" stroke="#33343c" stroke-width="2"/>
  </g>
  <g clip-path="url(#phoneB)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="697" y="106" width="80" height="16" rx="8" fill="#000000"/>
    <!-- orange mic indicator -->
    <circle cx="789" cy="114" r="3.5" fill="#ff9f0a"/>
    <!-- a claude session being dictated into -->
    <text x="628" y="150" font-size="9.5"><tspan fill="#28c840">●</tspan><tspan fill="#e6e6eb" font-weight="700">&#160;Aurora</tspan><tspan fill="#8d909b">&#160;· full screen</tspan></text>
    <text x="628" y="172" fill="#8d909b" font-size="8.5">⏺ Exporter errors now surface in</text>
    <text x="628" y="185" fill="#8d909b" font-size="8.5">  the retry queue with backoff.</text>
    <rect x="624" y="200" width="226" height="42" rx="8" fill="#17181f" stroke="#2c2d36"/>
    <text x="634" y="217" font-size="9"><tspan fill="#6e7079">❯</tspan><tspan fill="#e6e6eb">&#160;route the exporter errors into</tspan></text>
    <text x="634" y="231" font-size="9"><tspan fill="#e6e6eb">  the retry queue</tspan></text>
    <rect x="762" y="222" width="5" height="11" fill="#a78bfa" opacity="0.85"/>
    <!-- transcribing pill -->
    <rect x="624" y="252" width="226" height="24" rx="12" fill="#1c1420" stroke="#7c3aed"/>
    <text x="737" y="268" text-anchor="middle" font-size="9"><tspan fill="#a78bfa">●</tspan><tspan fill="#c9cad3">&#160;whisper large-v3-turbo · on-device · 1.4s</tspan></text>
    <!-- keyboard -->
    <rect x="612" y="290" width="250" height="276" fill="#141419"/>
    <g fill="#232430">
      <rect x="624" y="302" width="20" height="30" rx="5"/><rect x="648" y="302" width="20" height="30" rx="5"/><rect x="672" y="302" width="20" height="30" rx="5"/><rect x="696" y="302" width="20" height="30" rx="5"/><rect x="720" y="302" width="20" height="30" rx="5"/><rect x="744" y="302" width="20" height="30" rx="5"/><rect x="768" y="302" width="20" height="30" rx="5"/><rect x="792" y="302" width="20" height="30" rx="5"/><rect x="816" y="302" width="20" height="30" rx="5"/><rect x="838" y="302" width="12" height="30" rx="5"/>
      <rect x="636" y="338" width="20" height="30" rx="5"/><rect x="660" y="338" width="20" height="30" rx="5"/><rect x="684" y="338" width="20" height="30" rx="5"/><rect x="708" y="338" width="20" height="30" rx="5"/><rect x="732" y="338" width="20" height="30" rx="5"/><rect x="756" y="338" width="20" height="30" rx="5"/><rect x="780" y="338" width="20" height="30" rx="5"/><rect x="804" y="338" width="20" height="30" rx="5"/><rect x="828" y="338" width="22" height="30" rx="5"/>
      <rect x="624" y="374" width="30" height="30" rx="5"/><rect x="660" y="374" width="20" height="30" rx="5"/><rect x="684" y="374" width="20" height="30" rx="5"/><rect x="708" y="374" width="20" height="30" rx="5"/><rect x="732" y="374" width="20" height="30" rx="5"/><rect x="756" y="374" width="20" height="30" rx="5"/><rect x="780" y="374" width="20" height="30" rx="5"/><rect x="806" y="374" width="44" height="30" rx="5"/>
    </g>
    <!-- mic key, active -->
    <rect x="624" y="410" width="52" height="34" rx="7" fill="#7c3aed"/>
    <text x="650" y="432" text-anchor="middle" fill="#ffffff" font-size="13">🎙</text>
    <rect x="682" y="410" width="120" height="34" rx="7" fill="#232430"/>
    <text x="742" y="431" text-anchor="middle" fill="#8d909b" font-size="9">space</text>
    <rect x="808" y="410" width="42" height="34" rx="7" fill="#232430"/>
    <text x="829" y="431" text-anchor="middle" fill="#8d909b" font-size="9">⏎</text>
    <!-- waveform -->
    <g stroke="#a78bfa" stroke-width="2" stroke-linecap="round">
      <line x1="662" y1="470" x2="662" y2="482"/><line x1="672" y1="464" x2="672" y2="488"/><line x1="682" y1="458" x2="682" y2="494"/><line x1="692" y1="466" x2="692" y2="486"/><line x1="702" y1="472" x2="702" y2="480"/><line x1="712" y1="462" x2="712" y2="490"/><line x1="722" y1="468" x2="722" y2="484"/><line x1="732" y1="456" x2="732" y2="496"/><line x1="742" y1="466" x2="742" y2="486"/><line x1="752" y1="472" x2="752" y2="480"/><line x1="762" y1="460" x2="762" y2="492"/><line x1="772" y1="468" x2="772" y2="484"/><line x1="782" y1="474" x2="782" y2="478"/><line x1="792" y1="464" x2="792" y2="488"/><line x1="802" y1="470" x2="802" y2="482"/>
    </g>
    <text x="737" y="518" text-anchor="middle" fill="#8d909b" font-size="9">hold to speak · release to insert</text>
    <rect x="697" y="546" width="80" height="4" rx="2" fill="#33343c"/>
  </g>
  <text x="737" y="592" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#c9cad3"><tspan fill="#a78bfa" font-weight="700">②</tspan> HopBoard — on-device Whisper dictation; audio never leaves the phone</text>
</svg>
