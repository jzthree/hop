<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" role="img" aria-label="hop operations, three panels: a terminal running hop restore after a reboot, every session verified back with its conversation; a sign-in card with a passkey button, password plus 2FA, and a list of signed-in devices with revoke; and a signup page where a lab member requests their own subdomain with a university email and gets their own daemon once approved. A legend explains restore and recover, per-device logins, and the self-service front door.">
  <defs>
    <linearGradient id="canvasO" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16171c"/>
      <stop offset="1" stop-color="#101116"/>
    </linearGradient>
    <filter id="shadowO" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="winRestore"><rect x="40" y="78" width="292" height="318" rx="10"/></clipPath>
    <clipPath id="winLogin"><rect x="352" y="78" width="284" height="318" rx="10"/></clipPath>
    <clipPath id="winDoor"><rect x="656" y="78" width="284" height="318" rx="10"/></clipPath>
  </defs>

  <!-- canvas -->
  <rect x="0.5" y="0.5" width="979" height="619" rx="18" fill="url(#canvasO)" stroke="#272831"/>

  <!-- kicker -->
  <text x="490" y="44" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="0.14em" fill="#8d909b">SESSIONS THAT COME BACK · LOGINS THAT STAY YOURS · A FRONT DOOR FOR THE LAB</text>

  <!-- ═══════════ ① restore after a reboot ═══════════ -->
  <g filter="url(#shadowO)">
    <rect x="40" y="78" width="292" height="318" rx="10" fill="#17181d" stroke="#2e3038"/>
  </g>
  <g clip-path="url(#winRestore)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
    <rect x="40" y="78" width="292" height="30" fill="#1f2026"/>
    <circle cx="60" cy="93" r="5" fill="#ff5f57"/>
    <circle cx="76" cy="93" r="5" fill="#febc2e"/>
    <circle cx="92" cy="93" r="5" fill="#28c840"/>
    <text x="186" y="97" text-anchor="middle" fill="#8d909b" font-size="11" font-family="-apple-system, 'Segoe UI', sans-serif">after the reboot</text>
    <g fill="#c9cad3">
      <text x="54" y="128"><tspan fill="#8d909b">$</tspan> hop restore</text>
      <text x="54" y="150"><tspan fill="#3fb950">✓</tspan> Aurora        <tspan fill="#8d909b">claude --resume 68ede300…</tspan></text>
      <text x="54" y="166"><tspan fill="#3fb950">✓</tspan> Aurora-fork   <tspan fill="#8d909b">its fork, resumed too</tspan></text>
      <text x="54" y="182"><tspan fill="#3fb950">✓</tspan> Polaris       <tspan fill="#8d909b">codex resume 01a0b174…</tspan></text>
      <text x="54" y="198"><tspan fill="#3fb950">✓</tspan> Nebula        <tspan fill="#8d909b">shell, ~/code/nebula</tspan></text>
      <text x="54" y="214"><tspan fill="#f0883e">↻</tspan> Lyra          <tspan fill="#8d909b">trust dialog → answered</tspan></text>
      <text x="54" y="236" fill="#e6e6e9">5/5 verified running · 0 bare shells</text>
      <text x="54" y="252" fill="#8d909b">forks, folders, names: as you left them</text>
      <text x="54" y="286"><tspan fill="#8d909b">$</tspan> hop recover        <tspan fill="#8d909b">← inside a room</tspan></text>
      <text x="54" y="302"><tspan fill="#3fb950">✓</tspan> resumed the last agent run here</text>
      <text x="54" y="336" fill="#8d909b">a watchdog restarts the host; every</text>
      <text x="54" y="350" fill="#8d909b">replacement restores the fleet, and</text>
      <text x="54" y="364" fill="#8d909b">a reconciler drives it to VERIFIED.</text>
    </g>
  </g>

  <!-- ═══════════ ② sign in, and who is signed in ═══════════ -->
  <g filter="url(#shadowO)">
    <rect x="352" y="78" width="284" height="318" rx="10" fill="#17181d" stroke="#2e3038"/>
  </g>
  <g clip-path="url(#winLogin)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
    <rect x="352" y="78" width="284" height="30" fill="#1f2026"/>
    <rect x="404" y="85" width="180" height="16" rx="8" fill="#101116" stroke="#2e3038"/>
    <text x="494" y="96.5" text-anchor="middle" fill="#8d909b" font-size="10">https://hop.example.com</text>
    <text x="494" y="134" text-anchor="middle" fill="#e6e6e9" font-size="14" font-weight="700" font-family="-apple-system, 'Segoe UI', sans-serif">Sign in to hop</text>
    <rect x="374" y="146" width="240" height="28" rx="7" fill="#7c3aed"/>
    <text x="494" y="164" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">Continue with Touch ID</text>
    <text x="494" y="192" text-anchor="middle" fill="#8d909b" font-size="10">or password + 6-digit code</text>
    <line x1="374" y1="206" x2="614" y2="206" stroke="#2e3038"/>
    <text x="374" y="226" fill="#8d909b" font-size="10" letter-spacing="0.1em">SIGNED-IN DEVICES</text>
    <g fill="#c9cad3">
      <text x="374" y="246"><tspan fill="#3fb950">●</tspan> MacBook · Safari         <tspan fill="#8d909b">now · this device</tspan></text>
      <text x="374" y="264"><tspan fill="#3fb950">●</tspan> iPhone · hop-ios         <tspan fill="#8d909b">2h ago</tspan></text>
      <text x="374" y="282"><tspan fill="#8d909b">●</tspan> Lab desktop · Chrome     <tspan fill="#f0883e">revoke</tspan></text>
      <text x="374" y="300"><tspan fill="#8d909b">●</tspan> capture rig · token      <tspan fill="#8d909b">expires in 1d</tspan></text>
    </g>
    <line x1="374" y1="316" x2="614" y2="316" stroke="#2e3038"/>
    <text x="374" y="336" fill="#8d909b" font-size="10">each device its own session — revoke one,</text>
    <text x="374" y="350" fill="#8d909b" font-size="10">the others stay signed in. Every sign-in</text>
    <text x="374" y="364" fill="#8d909b" font-size="10">and revoke lands in a rotated audit log.</text>
  </g>

  <!-- ═══════════ ③ the front door ═══════════ -->
  <g filter="url(#shadowO)">
    <rect x="656" y="78" width="284" height="318" rx="10" fill="#17181d" stroke="#2e3038"/>
  </g>
  <g clip-path="url(#winDoor)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
    <rect x="656" y="78" width="284" height="30" fill="#1f2026"/>
    <rect x="708" y="85" width="180" height="16" rx="8" fill="#101116" stroke="#2e3038"/>
    <text x="798" y="96.5" text-anchor="middle" fill="#8d909b" font-size="10">hop.zhoulab.io/signup</text>
    <text x="798" y="134" text-anchor="middle" fill="#e6e6e9" font-size="14" font-weight="700" font-family="-apple-system, 'Segoe UI', sans-serif">Your own hop</text>
    <text x="678" y="158" fill="#8d909b" font-size="10">university email</text>
    <rect x="678" y="164" width="240" height="24" rx="6" fill="#101116" stroke="#2e3038"/>
    <text x="688" y="180" fill="#c9cad3">alice@university.edu</text>
    <text x="678" y="206" fill="#8d909b" font-size="10">name</text>
    <rect x="678" y="212" width="240" height="24" rx="6" fill="#101116" stroke="#2e3038"/>
    <text x="688" y="228" fill="#c9cad3">alice<tspan fill="#8d909b"> → hop-alice.zhoulab.io</tspan></text>
    <rect x="678" y="248" width="240" height="26" rx="7" fill="#7c3aed"/>
    <text x="798" y="265" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">Request a seat</text>
    <g fill="#c9cad3">
      <text x="678" y="298"><tspan fill="#3fb950">✓</tspan> identity checked at the edge</text>
      <text x="678" y="316"><tspan fill="#3fb950">✓</tspan> approved by the admin, one command</text>
      <text x="678" y="334"><tspan fill="#3fb950">✓</tspan> a seat is spent only when claimed</text>
      <text x="678" y="358" fill="#e6e6e9">one subdomain, one daemon, one wall —</text>
      <text x="678" y="372" fill="#e6e6e9">hers, under the lab's own domain.</text>
    </g>
  </g>

  <!-- numbered badges -->
  <g font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#ffffff">
    <circle cx="40" cy="78" r="12" fill="#8b6ef0"/><text x="40" y="82.5" text-anchor="middle">1</text>
    <circle cx="352" cy="78" r="12" fill="#8b6ef0"/><text x="352" y="82.5" text-anchor="middle">2</text>
    <circle cx="656" cy="78" r="12" fill="#8b6ef0"/><text x="656" y="82.5" text-anchor="middle">3</text>
  </g>

  <!-- legend -->
  <g font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14">
    <circle cx="70" cy="452" r="11" fill="#8b6ef0"/><text x="70" y="456.5" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">1</text>
    <text x="94" y="457" fill="#e6e6e9"><tspan font-weight="700">Restore, verified</tspan><tspan fill="#93939b"> — after a crash or reboot every session returns as its conversation, its fork, its folder.</tspan></text>

    <circle cx="70" cy="490" r="11" fill="#8b6ef0"/><text x="70" y="494.5" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">2</text>
    <text x="94" y="495" fill="#e6e6e9"><tspan font-weight="700">Per-device logins</tspan><tspan fill="#93939b"> — passkeys, password + 2FA, a session per device you can revoke one at a time, an audit log that rotates.</tspan></text>

    <circle cx="70" cy="528" r="11" fill="#8b6ef0"/><text x="70" y="532.5" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">3</text>
    <text x="94" y="533" fill="#e6e6e9"><tspan font-weight="700">A front door</tspan><tspan fill="#93939b"> — self-service subdomains, gated on an identity check and your approval; one daemon per person.</tspan></text>

    <text x="490" y="586" text-anchor="middle" fill="#6e6e73" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">hop restore · hop recover · hop admin approve &lt;name&gt; · settings → Manage devices · audit: ~/.hop2/logs</text>
  </g>
</svg>
